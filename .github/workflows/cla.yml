name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/AmeyaKasture/heap_hunter/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'AmeyaKasture,bot*'
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: |
            Thank you for your pull request.

            Before this can be merged, every contributor on this PR must sign the
            Heap Hunter Contributor License Agreement. Please:

            1. Read [CLA.md](https://github.com/AmeyaKasture/heap_hunter/blob/main/CLA.md)
               in full.
            2. Comment on this PR with the following line (case-sensitive):

               `I have read the CLA Document and I hereby sign the CLA`

            The bot will record your signature in `signatures/version1/cla.json`
            and re-run the CLA check. If you have already signed for this repo,
            just comment `recheck` to refresh the status.